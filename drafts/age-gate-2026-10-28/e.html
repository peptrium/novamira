<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=390"><link rel=stylesheet href=common.css><style>
.ov{position:fixed;inset:0;background:rgba(8,9,11,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;color:#fff}
.pass{width:100%;border-radius:22px;overflow:hidden;background:linear-gradient(150deg,#2b3036,#111418 55%,#1d2126);border:1px solid #3a3f45;box-shadow:0 30px 60px rgba(0,0,0,.5);position:relative}
.pass:before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.10) 45%,transparent 55%)}
.t{padding:20px 20px 16px;display:flex;justify-content:space-between;align-items:flex-start}
.t img{width:52px}.lb{font-size:10px;letter-spacing:.2em;color:#8E959E;font-weight:700}
.t .r{text-align:right}.t .r b{display:block;font-size:13px;letter-spacing:.28em;margin-top:4px}
.nm{padding:0 20px 18px}.nm div{font-size:26px;font-weight:800;line-height:1.1}.nm span{color:#8E959E}
.perf{position:relative;border-top:2px dashed #3a3f45;margin:0 14px}
.perf:before,.perf:after{content:'';position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:#0f1114}.perf:before{left:-26px}.perf:after{right:-26px}
.b{padding:16px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px}.f .lb{display:block;margin-bottom:4px}.f b{font-size:13.5px}
.ok{color:#7BE3A5}
.hold{margin-top:18px;width:100%;position:relative;border-radius:18px;padding:18px;background:#F2F3F4;color:#0D0F12;font:700 15.5px Sora;text-align:center;overflow:hidden}
.hold i{position:absolute;left:0;top:0;bottom:0;width:62%;background:#D7DADD}.hold span{position:relative}
.note{font-size:12px;color:#8E959E;text-align:center;margin-top:10px;line-height:1.5}
</style></head><body><div class=ov>
<div class=pass><div class=t><img src=logo.png><div class=r><span class=lb>ZUGANG</span><b class=chrome>PEPTRIUM</b></div></div>
<div class=nm><div>Forschungs­zugang<br><span>für den Shop</span></div></div>
<div class=perf></div>
<div class=b><div class=f><span class=lb>ALTER</span><b>18+ <span class=ok>✓</span></b></div><div class=f><span class=lb>ZWECK</span><b>Nur Labor <span class=ok>✓</span></b></div>
<div class=f><span class=lb>VERSAND</span><b>Diskret, DE</b></div><div class=f><span class=lb>GÜLTIG</span><b>365 Tage</b></div></div></div>
<div class=hold><i></i><span>Gedrückt halten zum Betreten</span></div>
<div class=note>Mit dem Betreten bestätigst du: 18+ und Kauf ausschließlich für In-vitro-/Laborforschung, nicht für Mensch oder Tier. · AGB</div>
</div></body></html>
