<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=390"><link rel=stylesheet href=common.css><style>
.ov{position:fixed;inset:0;background:linear-gradient(180deg,rgba(8,9,11,.25),rgba(8,9,11,.75))}
.top{position:absolute;top:70px;left:0;right:0;text-align:center}
.top img{width:84px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}.top div{font-weight:800;letter-spacing:.32em;font-size:15px;margin-top:10px}
.sh{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:12px 20px 30px;box-shadow:0 -20px 50px rgba(0,0,0,.35)}
.hd{width:44px;height:5px;border-radius:9px;background:#DCDEE0;margin:0 auto 18px}
h1{font-size:24px;line-height:1.2;margin:0 0 8px;color:#0D0F12;font-weight:800}
p{font-size:13.5px;line-height:1.6;color:#4B5157;margin:0 0 16px}
.chips{display:flex;gap:8px;margin-bottom:16px}.chips span{flex:1;text-align:center;font-size:11.5px;font-weight:700;color:#0D0F12;background:#F2F3F4;border-radius:12px;padding:10px 4px}
.chips i{display:block;font-style:normal;font-size:18px;margin-bottom:3px}
.ck{display:flex;gap:12px;align-items:flex-start;border:1.5px solid #0D0F12;border-radius:14px;padding:14px;font-size:13.5px;line-height:1.5;color:#0D0F12}
.bx{flex:0 0 22px;height:22px;border-radius:7px;background:#0D0F12;position:relative;margin-top:1px}.bx:after{content:'';position:absolute;left:7px;top:3px;width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.btn{margin-top:14px;width:100%;border:0;border-radius:14px;padding:17px;background:#0D0F12;color:#fff;font:700 15.5px Sora}
.ft{margin-top:12px;text-align:center;font-size:11.5px;color:#8a9099}
</style></head><body><div class=ov><div class=top><img src=logo.png><div class=chrome>PEPTRIUM</div></div>
<div class=sh><div class=hd></div>

<p>Peptrium verkauft ausschließlich Forschungspeptide für die Laborforschung – nicht für den Gebrauch an Mensch oder Tier.</p>
<div class=chips><span><i>🔞</i>Ab 18</span><span><i>🧪</i>Nur Labor</span><span><i>📦</i>Diskret</span></div>
<div class=ck><span class=bx></span><span>Ich bin <b>mindestens 18 Jahre</b> alt und kaufe ausschließlich für <b>In-vitro-/Laborforschung</b>.</span></div>
<button class=btn>Bestätigen & weiter</button>
<div class=ft>AGB · Forschungsnutzung</div></div></div></body></html>
