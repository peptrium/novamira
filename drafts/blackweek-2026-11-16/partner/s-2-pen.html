<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{width:360px;height:640px;overflow:hidden;font-family:Inter,sans-serif;color:#fff;background:#000;position:relative}
.chrome{background:linear-gradient(180deg,#FFFFFF 0%,#F1F3F5 26%,#A3A9B1 48%,#5F656D 53%,#D9DDE1 68%,#FFFFFF 82%,#9AA0A8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.steel{background:linear-gradient(180deg,#2A2D33 0%,#5A6068 40%,#0E1013 55%,#3B4047 80%,#16181C 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.vw{position:absolute}.vw img{display:block;width:100%;position:relative;z-index:2}
.vw .rim{position:absolute;inset:0;z-index:3;-webkit-mask-size:100% 100%;mask-size:100% 100%;mix-blend-mode:screen}
.vw .shadow{position:absolute;left:-20%;right:-20%;bottom:-3%;height:9%;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.9),transparent 70%);z-index:1}
.vw .refl{position:absolute;left:0;right:0;top:100%;height:40%;overflow:hidden;z-index:1;opacity:.2;-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%)}.vw .refl img{transform:scaleY(-1);filter:blur(1.5px)}
.beam{position:absolute;left:50%;top:-40px;width:400px;height:560px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(235,240,250,.22),rgba(220,228,240,.05) 70%,transparent);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(14px)}
.hz{position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35) 35%,rgba(255,255,255,.7) 50%,rgba(255,255,255,.35) 65%,transparent)}
.lg{position:absolute;left:0;right:0;top:62px;display:flex;justify-content:center;align-items:center;gap:7px;font:600 15px Sora}.lg img{width:28px}
.ey{font:600 9.5px/1 Inter;letter-spacing:.5em;color:#AEB4BB;text-align:center;padding-left:.5em}
.c{position:absolute;left:0;right:0;text-align:center}
.pill{display:inline-block;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 16px;font:600 12px Inter;letter-spacing:.04em}
.grain{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body{background:#F3F3F1;color:#0B0C0E}.lg{color:#0B0C0E}.lg img{filter:brightness(.15)}
</style></head><body><div class="lg"><img src="logo.png">Peptrium</div><div style="position:absolute;left:24px;top:132px"><div style="font:600 9.5px Inter;letter-spacing:.4em;color:#7A8088">BLACK WEEK</div><div style="font:800 76px/.86 Sora;letter-spacing:-.06em;margin-top:12px">Der<br>Pen.</div><div class="steel" style="font:800 76px/.9 Sora;letter-spacing:-.06em">−30%</div><div style="font:500 14px/1.4 Inter;color:#3A3F46;margin-top:12px">Fertig gemischt.<br>Kein Anmischen.</div></div><div style="position:absolute;left:24px;right:24px;top:486px;height:24px;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.25),transparent 70%)"></div><img src="pen-x.png" style="position:absolute;left:20px;top:428px;width:320px;transform:rotate(-9deg);filter:drop-shadow(0 20px 18px rgba(0,0,0,.25))"><div class="c" style="top:530px"><div style="font:500 12.5px Inter;color:#3A3F46">Mit Code · nur bis Donnerstag, 26.11.</div><div style="display:inline-block;margin-top:10px;border:1.5px dashed rgba(7,8,10,.55);border-radius:12px;padding:8px 16px;font:800 22px Sora;letter-spacing:.06em;color:#07080A">BLACK30</div><div style="font:500 11.5px Inter;color:#3A3F46;margin-top:7px">Code an der Kasse · peptrium.com</div></div><div class="grain"></div><script src="vial.js"></script></body></html>
