<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{height:810px;background:#000}
.sc{position:absolute;left:0;right:0;top:0;height:810px;overflow:hidden;background:radial-gradient(70% 38% at 50% 0%,#1A1C20,#000 70%)}
.beam{position:absolute;left:50%;top:-40px;width:420px;height:720px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(240,244,252,.30),rgba(220,228,240,.05) 70%,transparent);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(16px)}
.pool{position:absolute;left:50%;top:528px;width:520px;height:120px;transform:translateX(-50%);background:radial-gradient(50% 50% at 50% 50%,rgba(230,236,248,.32),transparent 70%)}
.floor{position:absolute;left:0;right:0;top:580px;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 30%)}
.hz{position:absolute;left:0;right:0;top:580px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35) 35%,rgba(255,255,255,.7) 50%,rgba(255,255,255,.35) 65%,transparent)}
.dust{position:absolute;border-radius:50%;background:#fff}
.txt{position:absolute;left:0;right:0;top:84px;text-align:center;z-index:10}
.ey{font:600 10.5px/1 Inter;letter-spacing:.55em;color:#AEB4BB;padding-left:.55em}
.big{font:800 128px/.9 Sora;letter-spacing:-.06em;margin:12px 0 6px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.8))}
.big sup{font-size:.42em;vertical-align:.95em;letter-spacing:-.02em;margin-left:4px}
.l1{font:500 17px/1.3 Inter;color:#fff;letter-spacing:-.005em}
.l2{font:400 13px/1.3 Inter;color:#8A9098;margin-top:5px}
.bot{position:absolute;left:16px;right:16px;top:648px;z-index:10}
.cdn{display:flex;justify-content:center;gap:14px;font:300 12px/1 Inter;color:#8A9098;letter-spacing:.18em;margin-bottom:14px;font-variant-numeric:tabular-nums}
.cdn b{font:600 13px/1 Inter;color:#fff;letter-spacing:.06em;margin-right:3px}
.lnk{text-align:center;font:500 12.5px/1 Inter;color:#9BA1A8;margin-top:13px}.lnk u{text-decoration:none;color:#fff;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:1px}
.pen{position:absolute;z-index:6;filter:drop-shadow(0 22px 26px rgba(0,0,0,.85)) brightness(.96)}
.sc:after{content:"";position:absolute;inset:0;background:radial-gradient(60% 30% at 50% 72%,rgba(255,255,255,.07),transparent 70%);pointer-events:none}</style></head><body>
<div class="sc">
 <div class="beam"></div><div class="pool"></div><div class="floor"></div><div class="hz"></div>
 <div class="vw" data-src="ghk.png" data-rim="left" data-color="210,220,235" style="left:48px;top:350px;width:84px;filter:brightness(.62) blur(.4px)"></div>
 <div class="vw" data-src="glow.png" data-rim="right" data-color="210,220,235" style="left:258px;top:350px;width:84px;filter:brightness(.62) blur(.4px)"></div>
 <div class="vw" data-src="reta.png" data-rim="both" data-top="1" data-color="225,232,245" style="left:139px;top:300px;width:112px"></div>
 
 <i class="dust" style="left:170px;top:200px;width:2px;height:2px;opacity:.5"></i><i class="dust" style="left:214px;top:260px;width:1.5px;height:1.5px;opacity:.35"></i><i class="dust" style="left:190px;top:320px;width:2.5px;height:2.5px;opacity:.25;filter:blur(1px)"></i><i class="dust" style="left:236px;top:160px;width:1.5px;height:1.5px;opacity:.45"></i><i class="dust" style="left:156px;top:290px;width:1px;height:1px;opacity:.6"></i>
   <div class="grain"></div>
</div>
</div>
<script src="vial.js"></script></body></html>
