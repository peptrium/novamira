<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
html,body{margin:0;background:#000;overflow-x:hidden}body{height:auto}
.m{position:relative;overflow:hidden;width:390px;background:radial-gradient(70% 46% at 50% 52%,#2C3036 0%,#101114 55%,#000 85%);color:#fff;font-family:Inter,sans-serif}
.beam{position:absolute;left:50%;top:-40px;width:420px;height:560px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 80%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(10px)}
.lg{text-align:center;padding:26px 0 0;position:relative}.lg img{width:34px;display:block;margin:0 auto}
.ey{position:relative;text-align:center;margin-top:22px;font:700 10.5px/1 Inter;letter-spacing:.32em;color:#C9CDD2}
.ey b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3DDC84;margin-right:9px;vertical-align:1px;box-shadow:0 0 10px #3DDC84}
.chrome{background:linear-gradient(180deg,#FFFFFF 0%,#F1F3F5 26%,#A3A9B1 48%,#5F656D 53%,#D9DDE1 68%,#FFFFFF 82%,#9AA0A8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{position:relative;margin:14px 0 0;text-align:center;font:800 46px/1 Sora,Inter;letter-spacing:-.045em}
h1 span{display:block;font:600 27px/1.2 Sora,Inter;letter-spacing:-.03em;color:#C9CDD2;-webkit-text-fill-color:#C9CDD2;margin-top:6px}
.st{position:relative;height:360px;margin-top:6px}
.vw{position:absolute;left:50%;top:10px;width:118px;transform:translateX(-50%)}
.vw img{display:block;width:100%;position:relative;z-index:2;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
.vw .shadow{position:absolute;left:-40%;right:-40%;bottom:-3%;height:9%;background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.8),transparent 70%);z-index:1}
.vw .refl{position:absolute;left:0;right:0;top:100%;height:30%;overflow:hidden;opacity:.18;-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%)}
.vw .refl img{transform:scaleY(-1);filter:blur(1.5px)}
.floor{position:absolute;left:0;right:0;top:330px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
.pr{position:relative;margin:4px 26px 0;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px 18px;background:rgba(255,255,255,.04)}
.pr .l{font:600 12px/1.3 Inter;color:#9AA0A8;letter-spacing:.04em}.pr .l b{display:block;color:#fff;font-size:14px;letter-spacing:0;margin-top:2px}
.pr .r{text-align:right}.pr s{font:500 12px Inter;color:#6E747B}.pr .n{font:800 26px/1 Sora,Inter;letter-spacing:-.03em}
.tag{display:inline-block;margin-left:8px;background:#fff;color:#000;font:800 11px/1 Inter;padding:5px 8px;border-radius:999px;vertical-align:5px}
.pad{height:26px}
.grain{position:absolute;inset:0;z-index:50;pointer-events:none;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head><body><div class="m">
<div class="beam"></div>
<div class="lg"><img src="logo.png"></div>
<div class="ey"><b></b>WIEDER AUF LAGER</div>
<h1 class="chrome">Cagrilintid<span>ist wieder da.</span></h1>
<div class="st"><div class="floor"></div><div class="vw"><div class="shadow"></div><img src="cagri.png"><div class="refl"><img src="cagri.png"></div></div></div>
<div class="pr"><div class="l">BLACK WEEK<b>Cagrilintid · 10 mg</b></div><div class="r"><s>104,90 €</s><br><span class="n">73,43 €</span><span class="tag">−30 %</span></div></div>
<div class="pad"></div><div class="grain"></div></div></body></html>
