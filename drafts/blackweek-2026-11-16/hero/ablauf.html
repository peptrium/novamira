<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
html,body{margin:0;background:#000}body{height:auto}
.m{position:relative;overflow:hidden;width:390px;background:radial-gradient(70% 50% at 50% 46%,#2C3036 0%,#101114 55%,#000 85%);color:#fff;font-family:Inter,sans-serif;text-align:center;padding-bottom:30px}
.beam{position:absolute;left:50%;top:-40px;width:420px;height:520px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,0) 80%);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);filter:blur(10px)}
.lg{position:relative;padding-top:26px}.lg img{width:34px;display:block;margin:0 auto}
.ey{position:relative;margin-top:22px;font:700 10.5px/1 Inter;letter-spacing:.32em;color:#C9CDD2}.ey b{display:inline-block;width:7px;height:7px;border-radius:50%;background:#F2C94C;margin-right:9px;vertical-align:1px;box-shadow:0 0 10px #F2C94C}
.chrome{background:linear-gradient(180deg,#FFFFFF 0%,#F1F3F5 26%,#A3A9B1 48%,#5F656D 53%,#D9DDE1 68%,#FFFFFF 82%,#9AA0A8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tk{position:relative;margin:28px auto 0;width:300px;border-radius:20px;background:linear-gradient(125deg,#FBFBFC 0%,#C9CDD3 18%,#7E848C 38%,#EDEFF1 52%,#9AA0A8 70%,#F4F5F7 100%);color:#0B0C0E;padding:20px 0 18px;box-shadow:0 30px 60px rgba(0,0,0,.7);transform:rotate(-3deg)}
.tk small{display:block;font:700 10px Inter;letter-spacing:.3em;color:#3A3F46}
.tk .c{display:inline-block;margin-top:10px;border:2px dashed rgba(0,0,0,.45);border-radius:12px;padding:8px 18px;font:800 40px/1 Sora;letter-spacing:.06em}
.tk .s{position:absolute;right:-12px;top:-14px;background:#0B0C0E;color:#fff;font:800 15px/1 Sora;padding:9px 11px;border-radius:999px;transform:rotate(8deg);box-shadow:0 8px 20px rgba(0,0,0,.5)}
h1{position:relative;margin:34px 0 0;font:800 40px/1.02 Sora;letter-spacing:-.045em}
h1 span{display:block;font:600 24px/1.2 Sora;letter-spacing:-.03em;color:#C9CDD2;-webkit-text-fill-color:#C9CDD2;margin-top:8px}
.cnt{position:relative;display:flex;justify-content:center;gap:8px;margin-top:22px}.cnt div{width:66px;padding:10px 0;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font:800 22px/1 Sora}.cnt small{display:block;font:600 8.5px Inter;letter-spacing:.18em;color:#9AA0A8;margin-top:6px}
.nt{position:relative;margin-top:14px;font:500 13px Inter;color:#9AA0A8}
</style></head><body><div class="m"><div class="beam"></div><div class="lg"><img src="logo.png"></div>
<div class="ey"><b></b>NUR NOCH BIS MORGEN</div>
<div class="tk"><small>DEIN CODE</small><span class="c">BLACK30</span><span class="s">−30 %</span></div>
<h1 class="chrome">BLACK30<span>läuft morgen ab.</span></h1>
<div class="cnt"><div>DO<small>26.11.</small></div><div>23:59<small>UHR</small></div></div>
<div class="nt">Danach gilt der Code nicht mehr.</div></div></body></html>
