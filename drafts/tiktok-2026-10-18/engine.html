<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;src:url(file:///usr/share/fonts/opentype/inter/Inter-Medium.otf);font-weight:500}
@font-face{font-family:I;src:url(file:///usr/share/fonts/opentype/inter/Inter-Bold.otf);font-weight:700}
@font-face{font-family:I;src:url(file:///usr/share/fonts/opentype/inter/Inter-ExtraBold.otf);font-weight:800}
:root{--a:#5CE1E6}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#07090C;font-family:I,sans-serif;color:#fff}
canvas{position:absolute;inset:0}
.top{position:absolute;top:120px;left:0;right:0;text-align:center}
.top img{width:118px;height:118px;filter:drop-shadow(0 0 22px rgba(255,255,255,.18))}
.top div{font:700 30px I;letter-spacing:.34em;padding-left:.34em;margin-top:4px;color:#E8EBEE}
.prog{position:absolute;left:90px;right:90px;top:330px;display:flex;gap:10px}
.prog b{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.16);overflow:hidden}
.prog b i{display:block;height:100%;width:0;background:#fff}
.sc{position:absolute;left:80px;right:80px;top:470px;opacity:0}
.eye{font:700 30px I;letter-spacing:.22em;color:var(--a);text-transform:uppercase;margin-bottom:22px}
.h{font:800 88px/1.06 I;letter-spacing:-.015em}
.h em{font-style:normal;color:var(--a)}
.p{font:500 45px/1.35 I;color:#CFD6DC;margin-top:24px}
.card{background:rgba(10,13,18,.72);border:1px solid rgba(255,255,255,.12);border-radius:42px;padding:56px 54px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.hook{text-align:center;top:560px}
.hook .h{font-size:118px}
.hook .p{font-size:46px}
.rec{display:flex;justify-content:space-between;margin-top:46px}
.rc{width:250px;text-align:center}
.rc .o{width:190px;height:190px;margin:0 auto;border-radius:50%;border:4px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font:800 40px I;color:rgba(255,255,255,.35);transition:none}
.rc .o.on{border-color:var(--a);color:#fff;box-shadow:0 0 50px var(--a),inset 0 0 40px rgba(92,225,230,.25)}
.chips{display:flex;flex-wrap:wrap;gap:18px;margin-top:36px}
.chip{font:700 38px I;padding:18px 30px;border-radius:999px;border:2px solid var(--a);color:#fff;background:rgba(92,225,230,.08)}
.tl{margin-top:40px;display:flex;flex-direction:column;gap:26px}
.st{display:flex;align-items:center;gap:26px;font:700 46px I}
.st .d{width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font:800 32px I}
.st.ok .d{background:var(--a);border-color:var(--a);color:#06090C}
.st.now .d{border-color:var(--a);box-shadow:0 0 30px var(--a)}
.st small{display:block;font:500 32px I;color:#9FA8B0}
.end{text-align:center;top:520px}
.end img{width:240px;filter:drop-shadow(0 0 40px rgba(255,255,255,.25))}
.end .w{font:800 46px I;letter-spacing:.34em;padding-left:.34em;margin-top:12px}
.end .cta{display:inline-block;margin-top:70px;font:800 54px I;background:#fff;color:#07090C;padding:32px 60px;border-radius:999px}
.end .note{font:500 32px I;color:#C3CAD0;margin-top:44px}
.sub{position:absolute;left:90px;right:90px;top:1300px;text-align:center;font:700 50px/1.3 I;color:rgba(255,255,255,.35);text-shadow:0 3px 18px rgba(0,0,0,.9)}
.sub span.on{color:#fff}
.fine{position:absolute;left:0;right:0;top:1500px;text-align:center;font:500 26px I;color:rgba(255,255,255,.6)}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="top" id="top"><img src="logo.png"><div>PEPTRIUM</div></div>
<div class="prog" id="prog"></div>
<div id="scenes"></div>
<div class="sub" id="sub"></div>
<div class="fine">Alle Angaben zu Forschungszwecken · nicht für den menschlichen Gebrauch</div>
<script>
const $=id=>document.getElementById(id), E=x=>1-Math.pow(1-Math.max(0,Math.min(1,x)),3);
let D=null, SC=[];
// ---------- Hintergrund: Partikel + rotierende Peptidkette ----------
const cv=$('cv'), cx=cv.getContext('2d');
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const P=[...Array(140)].map((_,i)=>({x:rnd(i)*1080,y:rnd(i+500)*1920,r:1+rnd(i+900)*3,v:8+rnd(i+77)*26,a:.15+rnd(i+33)*.5}));
const N=16, B=[...Array(N)].map((_,i)=>({u:i/(N-1)}));
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function bg(t){
  const A=D.accent;
  const g=cx.createRadialGradient(540,860,80,540,860,1300); g.addColorStop(0,'#101820'); g.addColorStop(.55,'#0A0E13'); g.addColorStop(1,'#050608');
  cx.fillStyle=g; cx.fillRect(0,0,1080,1920);
  const g2=cx.createRadialGradient(540,900,0,540,900,700); g2.addColorStop(0,hexA(A,.10)); g2.addColorStop(1,hexA(A,0)); cx.fillStyle=g2; cx.fillRect(0,0,1080,1920);
  for(const p of P){const y=((p.y-p.v*t)%1920+1920)%1920; cx.fillStyle=hexA(A,p.a*.6); cx.beginPath(); cx.arc(p.x+Math.sin(t*.4+p.y)*12,y,p.r,0,6.3); cx.fill();}
  // Kette: Helix im Raum, langsam drehend, Perspektive
  const pts=B.map((b,i)=>{const ang=b.u*Math.PI*3.2+t*.55, R=170;
    let x=Math.cos(ang)*R, z=Math.sin(ang)*R, y=(b.u-.5)*900;
    const ry=t*.25, xx=x*Math.cos(ry)-y*Math.sin(ry)*.25, yy=y*Math.cos(ry)+x*Math.sin(ry)*.25;
    const s=700/(700+z); return {x:540+xx*s, y:960+yy*s, s, z};});
  cx.lineWidth=3; cx.strokeStyle=hexA(A,.28); cx.beginPath(); pts.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y)); cx.stroke();
  [...pts].sort((a,b)=>b.z-a.z).forEach((p,i)=>{const r=18*p.s; const gl=cx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3); gl.addColorStop(0,hexA(A,.55*p.s)); gl.addColorStop(1,hexA(A,0)); cx.fillStyle=gl; cx.beginPath(); cx.arc(p.x,p.y,r*3,0,6.3); cx.fill();
    const g3=cx.createRadialGradient(p.x-r*.35,p.y-r*.35,1,p.x,p.y,r); g3.addColorStop(0,'#ffffff'); g3.addColorStop(.4,'#C9D2DA'); g3.addColorStop(1,'#3A434C'); cx.fillStyle=g3; cx.beginPath(); cx.arc(p.x,p.y,r,0,6.3); cx.fill();});
  // Abdunkeln für Lesbarkeit
  cx.fillStyle='rgba(5,7,9,.35)'; cx.fillRect(0,0,1080,1920);
}
// ---------- Szenen ----------
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function build(){
  document.documentElement.style.setProperty('--a',D.accent);
  const prog=$('prog'); const mid=D.scenes.filter(s=>s.type!=='hook'&&s.type!=='end');
  mid.forEach(()=>prog.appendChild(el('<b><i></i></b>')));
  for(const s of D.scenes){
    let h='';
    if(s.type==='hook') h=`<div class="sc hook"><div class="h">${s.title}</div><div class="p">${s.tag||''}</div></div>`;
    if(s.type==='card') h=`<div class="sc"><div class="card"><div class="eye">${s.eye||''}</div><div class="h">${s.h}</div>${s.p?`<div class="p">${s.p}</div>`:''}</div></div>`;
    if(s.type==='receptors') h=`<div class="sc"><div class="card"><div class="eye">${s.eye}</div><div class="h">${s.h}</div><div class="rec">${s.labels.map(l=>`<div class="rc"><div class="o">${l}</div></div>`).join('')}</div></div></div>`;
    if(s.type==='chips') h=`<div class="sc"><div class="card"><div class="eye">${s.eye}</div><div class="h">${s.h}</div><div class="chips">${s.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div></div></div>`;
    if(s.type==='timeline') h=`<div class="sc"><div class="card"><div class="eye">${s.eye}</div><div class="h">${s.h}</div><div class="tl">${s.steps.map(x=>`<div class="st ${x.s}"><span class="d">${x.s==='ok'?'✓':(x.s==='now'?'…':'')}</span><span>${x.l}<small>${x.n||''}</small></span></div>`).join('')}</div></div></div>`;
    if(s.type==='end') h=`<div class="sc end"><img src="logo.png"><div class="w">PEPTRIUM</div><div class="cta">${s.cta||'Mehr Wissen: Link in Bio'}</div><div class="note">Nur für Laborforschungszwecke.</div></div>`;
    const n=el(h); $('scenes').appendChild(n); SC.push(n);
  }
}
window.setData=function(d){D=d;build();};
window.render=function(t){
  bg(t);
  const ss=D.scenes; let mi=0;
  ss.forEach((s,k)=>{
    const n=SC[k], a=s.t0, b=s.t1, last=k===ss.length-1;
    const i=E((t-a)/.45), o=last?0:E((t-(b-.35))/.35);
    const v=(t<a||(!last&&t>b))?0:Math.min(i,1-o);
    n.style.opacity=v; n.style.transform=`translateY(${(1-i)*70-o*30}px)`;
    if(s.type==='receptors') n.querySelectorAll('.o').forEach((x,j)=>x.classList.toggle('on',t>a+.8+j*.8));
    if(s.type==='chips') n.querySelectorAll('.chip').forEach((x,j)=>{const q=E((t-a-.6-j*.35)/.3);x.style.opacity=q;x.style.transform=`scale(${.7+.3*q})`;});
    if(s.type==='timeline') n.querySelectorAll('.st').forEach((x,j)=>{const q=E((t-a-.5-j*.45)/.35);x.style.opacity=q;x.style.transform=`translateX(${(1-q)*-40}px)`;});
    if(s.type!=='hook'&&s.type!=='end'){const bar=$('prog').children[mi]; if(bar) bar.firstChild.style.width=(100*Math.max(0,Math.min(1,(t-a)/(b-a))))+'%'; mi++;}
  });
  const endS=ss[ss.length-1]; $('prog').style.opacity=(t>ss[0].t1-.2&&t<endS.t0)?1:0;
  $('top').style.opacity=t<endS.t0?E(t/.6):1-E((t-endS.t0)/.4);
  // Untertitel: Wörter im Takt der Stimme hervorheben
  const cur=ss.find(s=>t>=s.t0&&t<s.t1)||endS, sub=$('sub'), txt=cur.sub||cur.say;
  if(sub.dataset.k!==txt){sub.dataset.k=txt; sub.innerHTML=txt.split(' ').map(w=>`<span>${w}</span>`).join(' ');}
  const ws=[...sub.children], tot=txt.length; let acc=0;
  const prog=(t-cur.v0)/Math.max(.1,cur.vd);
  ws.forEach(w=>{acc+=w.textContent.length+1; w.classList.toggle('on',acc/tot<=prog+.02);});
  sub.style.opacity=(cur.type==='end'?0:1);
};
</script></body></html>
