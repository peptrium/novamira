<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}body{width:1080px;height:1256px;overflow:hidden;font-family:Inter;background:#0A0612;position:relative}
.sky{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,#2A1240 0%,#140A22 45%,#07050C 100%)}
.moon{position:absolute;left:300px;top:400px;width:480px;height:480px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFD08A 0%,#FF9A3C 45%,#E0601A 75%,#9A3A10 100%);box-shadow:0 0 160px 60px rgba(255,122,26,.35),0 0 400px 120px rgba(255,90,20,.18)}
.moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 62% 60%,rgba(0,0,0,.18) 0 8%,transparent 9%),radial-gradient(circle at 35% 66%,rgba(0,0,0,.12) 0 5%,transparent 6%),radial-gradient(circle at 70% 30%,rgba(0,0,0,.1) 0 4%,transparent 5%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 120px 120px,#fff8,transparent),radial-gradient(2px 2px at 860px 90px,#fff8,transparent),radial-gradient(1.5px 1.5px at 960px 260px,#fff6,transparent),radial-gradient(1.5px 1.5px at 70px 330px,#fff6,transparent),radial-gradient(2px 2px at 700px 220px,#fff5,transparent),radial-gradient(1.5px 1.5px at 300px 210px,#fff5,transparent)}
.cap{position:absolute;top:70px;left:0;right:0;text-align:center;font:700 28px/1 Inter;letter-spacing:.34em;color:#E7C08F}
.h{position:absolute;top:118px;left:0;right:0;text-align:center;font:800 120px/1 Inter;letter-spacing:-.04em;color:#fff}
.h span{color:#FF8A2A;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.v{position:absolute;bottom:150px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.7))}
.ground{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,rgba(5,3,10,0),rgba(5,3,10,.75) 55%,#05030A)}
.refl{position:absolute;bottom:0;left:0;right:0;height:150px;background:linear-gradient(180deg,rgba(255,122,26,.10),transparent)}
.bat{position:absolute;fill:#05030A}
.chip{position:absolute;bottom:70px;left:0;right:0;text-align:center}
.chip b{display:inline-block;font:800 30px/1 Inter;letter-spacing:.22em;color:#FFD49A;border:1.5px solid rgba(255,200,140,.7);border-radius:99px;padding:18px 34px;background:rgba(30,14,4,.8);box-shadow:0 0 40px rgba(255,122,26,.35)}
</style></head><body><div class="sky"></div><div class="stars"></div><div class="moon"></div>
